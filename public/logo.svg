<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f2994a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe4c7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#9a3412" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="20" ry="20" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Inner subtle border -->
  <rect x="10" y="10" width="80" height="80" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- TJ letters centered -->
  <text x="50" y="62" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#textGradient)" text-anchor="middle">TJ</text>
  
  <!-- Small chart icon / accent line at bottom -->
  <path d="M25 78 L35 73 L45 76 L55 70 L65 74 L75 68" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Small dot accents -->
  <circle cx="75" cy="68" r="2.5" fill="#10b981"/>
</svg>
